<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Help | Beautiful You By M.K.</title><link rel="stylesheet" href="site.css"></head><body><header class="site-header"><a class="brand" href="index.html">Beautiful You <small>By M.K.</small></a><nav class="links"><a href="/">Home</a><a href="/about">About</a><a href="/programmes">Programmes</a><a href="/gallery">Gallery</a><a href="/resources">Resources</a><a href="/donate">Donate</a><a href="/partner">Partner</a><a href="/contact">Contact</a><a class="button" href="/get-help">I need help</a><a class="login-link" href="/admin/login">Login</a></nav></header><main class="login"><p class="eyebrow">Confidential support</p><h1>You deserve support.</h1><p class="lead">Share only what feels safe. This form is not an emergency service.</p><form id="help-form"><label class="field">How can we contact you?<input name="contact" required></label><label class="field">What support do you need?<textarea name="message" required></textarea></label><label class="field">Is there an immediate safety concern?<select name="urgent"><option value="false">No</option><option value="true">Yes</option></select></label><label class="field"><span><input name="consent" type="checkbox" value="true" required> I consent to Beautiful You By M.K. using this information to respond safely.</span></label><button class="button" type="submit">Send securely</button><p id="status" class="status" hidden></p></form></main><script>document.querySelector('#help-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=document.querySelector('#status');s.hidden=false;s.textContent='Sending…';const body=Object.fromEntries(new FormData(f));body.consent=body.consent==='true';const r=await fetch('/api/help-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();s.textContent=r.ok?d.message:(d.error||'Unable to send.');if(r.ok)f.reset()})</script></body></html>
