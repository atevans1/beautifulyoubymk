<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation interest | Beautiful You By M.K.</title><link rel="stylesheet" href="site.css"><style>.field{display:grid;gap:.4rem;margin:1rem 0}.field input,.field textarea{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/donate">← Donate</a><p class="eyebrow">Support Beautiful You</p><h1>Ask about giving.</h1><p class="lead">Share your name and email, and the team can respond with approved ways to support the work.</p><form id="donation-form"><label class="field">Name<input name="display_name" maxlength="254" autocomplete="name" required></label><label class="field">Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><button class="button" type="submit">Send enquiry</button><p id="status" class="status" hidden aria-live="polite"></p></form></main>
<script>const form=document.querySelector('#donation-form'),status=document.querySelector('#status');form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button'),body=Object.fromEntries(new FormData(form));body.kind='donation';button.disabled=true;status.hidden=false;status.textContent='Sending…';try{const response=await fetch('/api/public-enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to send.');status.textContent=data.message;form.reset()}catch(error){status.textContent=error.message}finally{button.disabled=false}})</script><script src="/theme.js" defer></script></body></html>
