<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation interest | Beautiful You By M.K.</title><link rel="stylesheet" href="site.css"></head><body><main class="login"><a class="back" href="donate.html">← Donate</a><p class="eyebrow">Support Beautiful You</p><h1>Ask about giving.</h1><form id="form"><label class="field">Name<input name="display_name" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Message<textarea name="message" placeholder="Tell us how you would like to support the work."></textarea></label><button class="button">Send enquiry</button><p id="status" class="status" hidden></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status');s.hidden=false;s.textContent='Sending…';const body=Object.fromEntries(new FormData(form));body.kind='donation';const r=await fetch('/api/public-enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();s.textContent=r.ok?d.message:(d.error||'Unable to send.');if(r.ok)form.reset()}</script></body></html>
