<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Password help | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"><style>.login{max-width:480px;margin:auto}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/admin/login">← Admin sign in</a><p class="eyebrow">Account access</p><h1 id="title">Reset your password.</h1><p class="lead" id="intro">Enter your admin email and, if it belongs to an account, we’ll send a secure reset link.</p><form id="request-form"><label class="field">Admin email<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="button" type="submit">Email me a reset link</button></form><form id="update-form" hidden><label class="field">New password<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="field">Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button" type="submit">Update password</button></form><p id="status" class="status" hidden aria-live="polite"></p></main>
<script>
const fragment=new URLSearchParams(location.hash.slice(1)),token=fragment.get('access_token'),type=fragment.get('type'),requestForm=document.querySelector('#request-form'),updateForm=document.querySelector('#update-form'),status=document.querySelector('#status');
if(type==='recovery'&&token){requestForm.hidden=true;updateForm.hidden=false;document.querySelector('#title').textContent='Choose a new password.';document.querySelector('#intro').textContent='Use at least 12 characters. This reset link can only be used once.';}
function show(message){status.hidden=false;status.textContent=message;}
requestForm.addEventListener('submit',async event=>{event.preventDefault();const button=requestForm.querySelector('button');button.disabled=true;try{const response=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:requestForm.elements.email.value})}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to request password reset.');show(data.message)}catch(error){show(error.message)}finally{button.disabled=false}});
updateForm.addEventListener('submit',async event=>{event.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){show('The passwords do not match.');return}const button=updateForm.querySelector('button');button.disabled=true;try{const response=await fetch('/api/password-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token,password})}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to update password.');history.replaceState(null,'',location.pathname);show(data.message);location.replace('/admin')}catch(error){show(error.message)}finally{button.disabled=false}});
</script><script src="/theme.js" defer></script></body></html>
