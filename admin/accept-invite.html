<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Finish account setup | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"><style>.login{max-width:480px;margin:auto}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/">← Beautiful You By M.K.</a><p class="eyebrow">Invited account</p><h1>Confirm your invitation.</h1><p class="lead">Confirm this invitation to verify your email. The site owner will send your one-time sign-in password separately; you’ll choose a private password before entering the admin workspace.</p><button class="button" id="accept-invite" type="button">Confirm invitation</button><p id="status" class="status" hidden aria-live="polite"></p></main>
<script>const fragment=new URLSearchParams(location.hash.slice(1)),accessToken=fragment.get('access_token'),status=document.querySelector('#status'),button=document.querySelector('#accept-invite');if(fragment.get('type')!=='invite'||!accessToken){button.disabled=true;status.hidden=false;status.textContent=fragment.get('error_description')||'This invitation link is missing or expired. Ask the site owner to send a new invitation.'}button.addEventListener('click',async()=>{button.disabled=true;status.hidden=false;status.textContent='Confirming your invitation…';try{const response=await fetch('/api/accept-invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:accessToken})}),data=await response.json();if(!response.ok)throw Error(data.error||'Invitation confirmation failed.');history.replaceState(null,'',location.pathname);button.hidden=true;status.textContent=data.message;}catch(error){status.textContent=error.message;button.disabled=false}});</script><script src="/theme.js" defer></script></body>
</html>
