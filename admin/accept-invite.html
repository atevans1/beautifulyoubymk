<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Finish account setup | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"><style>.login{max-width:480px;margin:auto}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/">← Beautiful You By M.K.</a><p class="eyebrow">Invited account</p><h1>Set your password.</h1><p class="lead">Choose a password to finish setting up your Beautiful You By M.K. admin account.</p><form id="setup-form"><label class="field">New password<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="field">Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button" type="submit">Finish setup</button><p id="status" class="status" hidden aria-live="polite"></p></form></main>
<script>const fragment=new URLSearchParams(location.hash.slice(1)),accessToken=fragment.get('access_token'),expiresIn=fragment.get('expires_in')||'3600',status=document.querySelector('#status'),form=document.querySelector('#setup-form');if(fragment.get('type')!=='invite'||!accessToken){form.hidden=true;status.hidden=false;status.textContent=fragment.get('error_description')||'This invitation link is missing or expired. Ask the site owner to send a new invitation.'}form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button'),password=document.querySelector('#password').value,confirmation=document.querySelector('#confirm-password').value;if(password!==confirmation){status.hidden=false;status.textContent='The passwords do not match.';return}button.disabled=true;status.hidden=false;status.textContent='Setting up your account…';try{const response=await fetch('/api/accept-invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:accessToken,expires_in:expiresIn,password})}),data=await response.json();if(!response.ok)throw Error(data.error||'Account setup failed.');history.replaceState(null,'',location.pathname);status.textContent=data.message;location.replace('/admin')}catch(error){status.textContent=error.message}finally{button.disabled=false}})</script><script src="/theme.js" defer></script></body>
</html>
