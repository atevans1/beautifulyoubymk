<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"></head><body><main class="login"><a class="back" href="../index.html">← Home</a><p class="eyebrow">Owner workspace</p><h1>Invite a member</h1><p class="lead">Only the Beautiful You owner can invite and assign site roles.</p><form id="invite-form"><label class="field">Email<input id="email" type="email" required></label><label class="field">Role<select id="role"><option value="admin">Admin</option><option value="manager">Manager</option><option value="editor">Editor</option></select></label><button class="button" type="submit">Send invitation</button><p id="status" class="status" hidden></p></form><p><a href="login.html">Return to login</a></p></main><script>const session=JSON.parse(sessionStorage.getItem('by-auth')||'null');if(!session?.access_token){location.href='login.html'}document.querySelector('#invite-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),s=document.querySelector('#status');b.disabled=true;s.hidden=false;s.textContent='Sending invitation…';try{const r=await fetch('/api/invite-member',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({email:document.querySelector('#email').value,role:document.querySelector('#role').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Invitation failed.');s.textContent=d.message;e.currentTarget.reset()}catch(err){s.textContent=err.message}finally{b.disabled=false}})</script></body></html>
