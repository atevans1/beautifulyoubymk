<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"><style>.invite{padding:1.5rem;background:var(--sage);border-radius:16px;margin:1.5rem 0}.field input,.field select{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}</style></head><body><main><a class="back" href="index.html">← Admin workspace</a><p class="eyebrow">Owner workspace</p><h1>Members</h1><p class="lead">Invite approved staff and manage their role and status. Your owner account cannot be changed here.</p><section class="invite"><h2>Invite a member</h2><form id="invite-form"><label class="field">Email<input name="email" type="email" required></label><label class="field">Role<select name="role"><option value="admin">Admin</option><option value="manager">Manager</option><option value="editor">Editor</option></select></label><button class="button" type="submit">Send invitation</button><p id="invite-status" class="status" hidden></p></form></section><h2>Current members</h2><div id="list">Loading…</div><p><a href="content.html">Content management</a> · <a href="/admin">Admin workspace</a></p></main><script src="session-guard.js"></script><script>const list=document.querySelector('#list'),inviteForm=document.querySelector('#invite-form'),inviteStatus=document.querySelector('#invite-status');inviteForm.onsubmit=async e=>{e.preventDefault();inviteStatus.hidden=false;inviteStatus.textContent='Sending invitation…';const r=await fetch('/api/invite-member',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(inviteForm)))}),d=await r.json();inviteStatus.textContent=r.ok?d.message:(d.error||'Invitation failed.');if(r.ok){inviteForm.reset();load()}};async function load(){const r=await fetch('/api/members',{credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load members');list.innerHTML=d.map(m=>`<article class="card"><p><strong>${m.user_id}</strong></p><label class="field">Role<select data-id="${m.id}" data-kind="role"><option ${m.role==='admin'?'selected':''}>admin</option><option ${m.role==='manager'?'selected':''}>manager</option><option ${m.role==='editor'?'selected':''}>editor</option></select></label><label class="field">Status<select data-id="${m.id}" data-kind="status"><option ${m.status==='active'?'selected':''}>active</option><option ${m.status==='suspended'?'selected':''}>suspended</option><option ${m.status==='invited'?'selected':''}>invited</option></select></label></article>`).join('')||'<p>No members found.</p>';list.querySelectorAll('select').forEach(x=>x.onchange=async()=>{const fields={id:x.dataset.id};list.querySelectorAll(`[data-id="${x.dataset.id}"]`).forEach(y=>fields[y.dataset.kind]=y.value);const r=await fetch('/api/members',{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});if(!r.ok)load()})}load().catch(e=>list.textContent=e.message)</script></body></html>
