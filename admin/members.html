<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Members | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../site.css">
  <style>.invite{padding:1.5rem;background:var(--sage);border-radius:16px;margin:1.5rem 0}.field input,.field select{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}</style>
</head>
<body>
  <main>
    <a class="back" href="/admin">← Admin workspace</a><p class="eyebrow">Owner workspace</p>
    <h1>Members</h1><p class="lead">Invite approved staff and manage their role and status. Your owner account cannot be changed here.</p>
    <section class="invite"><h2>Invite a member</h2><form id="invite-form">
      <label class="field">Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label class="field">Role<select name="role"><option value="admin">Admin</option><option value="manager">Manager</option><option value="editor">Editor</option></select></label>
      <button class="button" type="submit">Send invitation</button><p id="invite-status" class="status" hidden aria-live="polite"></p>
    </form></section>
    <h2>Current members</h2><div id="list" aria-live="polite">Loading…</div>
    <p><a href="/admin/content">Content management</a> · <a href="/admin">Admin workspace</a></p>
  </main>
  <script src="session-guard.js"></script>
  <script>
    const list=document.querySelector('#list');
    const inviteForm=document.querySelector('#invite-form');
    const inviteStatus=document.querySelector('#invite-status');
    function escapeText(value){const node=document.createElement('div');node.textContent=String(value||'');return node.innerHTML;}
    async function load(){
      const response=await fetch('/api/members',{credentials:'same-origin'}),data=await response.json();
      if(!response.ok)throw Error(data.error||'Unable to load members.');
      list.innerHTML=data.map(member=>`<article class="card"><p><strong>${escapeText(member.email||'Email unavailable')}</strong><br><small>${escapeText(member.user_id)}</small></p><label class="field">Role<select data-id="${escapeText(member.id)}" data-kind="role"><option value="admin" ${member.role==='admin'?'selected':''}>Admin</option><option value="manager" ${member.role==='manager'?'selected':''}>Manager</option><option value="editor" ${member.role==='editor'?'selected':''}>Editor</option></select></label><label class="field">Status<select data-id="${escapeText(member.id)}" data-kind="status"><option value="active" ${member.status==='active'?'selected':''}>Active</option><option value="suspended" ${member.status==='suspended'?'selected':''}>Suspended</option><option value="invited" ${member.status==='invited'?'selected':''}>Invited</option></select></label></article>`).join('')||'<p>No members found.</p>';
      list.querySelectorAll('select').forEach(select=>select.onchange=async()=>{
        const id=select.dataset.id,fields={id};list.querySelectorAll(`[data-id="${id}"]`).forEach(field=>fields[field.dataset.kind]=field.value);
        try{const response=await fetch('/api/members',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)}),data=await response.json();if(!response.ok)throw Error(data.error||'Could not save member changes.');await load();}
        catch(error){inviteStatus.hidden=false;inviteStatus.textContent=error.message;await load().catch(()=>{});}
      });
    }
    inviteForm.addEventListener('submit',async event=>{
      event.preventDefault();const button=inviteForm.querySelector('button');button.disabled=true;inviteStatus.hidden=false;inviteStatus.textContent='Sending invitation…';
      try{const response=await fetch('/api/invite-member',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(inviteForm)))}),data=await response.json();if(!response.ok)throw Error(data.error||'Invitation failed.');inviteStatus.textContent=data.message;inviteForm.reset();await load();}
      catch(error){inviteStatus.textContent=error.message;}
      finally{button.disabled=false;}
    });
    load().catch(error=>list.textContent=error.message);
  </script>
<script src="/theme.js" defer></script></body>
</html>
