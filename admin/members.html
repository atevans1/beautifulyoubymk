<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"></head><body><main class="login"><a class="back" href="../index.html">← Public site</a><p class="eyebrow">Owner workspace</p><h1>Members</h1><p class="lead">Review roles and account status. The owner account cannot be changed here.</p><div id="list">Loading…</div><p><a href="content.html">Content management</a> · <a href="login.html">Sign in</a></p></main><script>const s=JSON.parse(sessionStorage.getItem('by-auth')||'null');if(!s?.access_token)location.href='login.html';const list=document.querySelector('#list');async function load(){const r=await fetch('/api/members',{headers:{Authorization:`Bearer ${s.access_token}`}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load members');list.innerHTML=d.map(m=>`<article class="card"><p><strong>${m.user_id}</strong></p><label class="field">Role<select data-id="${m.id}" data-kind="role"><option ${m.role==='admin'?'selected':''}>admin</option><option ${m.role==='manager'?'selected':''}>manager</option><option ${m.role==='editor'?'selected':''}>editor</option><option ${m.role==='owner'?'selected':''}>owner</option></select></label><label class="field">Status<select data-id="${m.id}" data-kind="status"><option ${m.status==='active'?'selected':''}>active</option><option ${m.status==='suspended'?'selected':''}>suspended</option><option ${m.status==='invited'?'selected':''}>invited</option></select></label></article>`).join('');list.querySelectorAll('select').forEach(x=>x.onchange=async()=>{const fields={id:x.dataset.id};list.querySelectorAll(`[data-id="${x.dataset.id}"]`).forEach(y=>fields[y.dataset.kind]=y.value);await fetch('/api/members',{method:'PATCH',headers:{Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(fields)})})}load().catch(e=>list.textContent=e.message)</script></body></html>
