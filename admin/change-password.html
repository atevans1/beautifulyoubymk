<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose a new password | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"><style>.login{max-width:480px;margin:auto}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/">← Beautiful You By M.K.</a><p class="eyebrow">One-time sign-in</p><h1>Choose your password.</h1><p class="lead">Your site owner gave you a temporary password. Choose a private password of at least 12 characters to continue to the admin workspace.</p><form id="change-form"><label class="field">New password<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="field">Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button" type="submit">Save new password</button><p id="status" class="status" hidden aria-live="polite"></p></form></main>
<script>const form=document.querySelector('#change-form'),status=document.querySelector('#status');form.addEventListener('submit',async event=>{event.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){status.hidden=false;status.textContent='The passwords do not match.';return}const button=form.querySelector('button');button.disabled=true;status.hidden=false;status.textContent='Saving your new password…';try{const response=await fetch('/api/password-update',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}),data=await response.json();if(!response.ok)throw Error(data.error||'Password could not be changed.');status.textContent='Password updated. Opening the admin workspace.';location.replace('/admin')}catch(error){status.textContent=error.message}finally{button.disabled=false}});</script><script src="/theme.js" defer></script></body></html>
