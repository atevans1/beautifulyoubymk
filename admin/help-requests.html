<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help requests | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"><style>.request{padding:1rem;margin:1rem 0;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.request select{padding:.5rem;margin:.5rem 0}</style></head><body><main class="login"><a class="back" href="../index.html">← Public site</a><p class="eyebrow">Restricted inbox</p><h1>Help requests</h1><p class="lead">Only active owners, admins, and managers can view this inbox.</p><div id="list">Loading…</div><p><a href="content.html">Content management</a> · <a href="members.html">Manage members</a></p></main><script>const session=JSON.parse(sessionStorage.getItem('by-auth')||'null');if(!session?.access_token)location.href='login.html';const list=document.querySelector('#list');async function load(){const r=await fetch('/api/help-requests',{headers:{Authorization:`Bearer ${session.access_token}`}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load requests');list.innerHTML=d.length?d.map(x=>`<article class="request"><strong>${x.request_reference}</strong><p>${x.short_description||x.support_needed||'No description'}</p><small>${new Date(x.created_at).toLocaleString()} · ${x.safe_email||x.safe_phone||'No contact supplied'}</small><br><select data-id="${x.id}"><option>${x.status}</option><option>under_review</option><option>contacted</option><option>closed</option></select></article>`).join(''):'<p>No requests yet.</p>';list.querySelectorAll('select').forEach(s=>s.onchange=async()=>{await fetch('/api/help-requests',{method:'PATCH',headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({id:s.dataset.id,status:s.value})})})}load().catch(e=>list.textContent=e.message)</script></body></html>
