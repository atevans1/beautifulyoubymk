<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programme editor | Beautiful You By M.K.</title><link rel="stylesheet" href="../site.css"></head><body><main class="login"><a class="back" href="content.html">← Content management</a><p class="eyebrow">Programme editor</p><h1>Programmes</h1><p class="lead">Load the programme records you are authorised to manage.</p><button class="button" id="load">Load programmes</button><textarea id="data" style="width:100%;min-height:360px;margin-top:1rem"></textarea><button class="button" id="save">Save programmes</button><p id="status" class="status" hidden></p></main><script>const s=JSON.parse(sessionStorage.getItem('by-auth')||'null');if(!s?.access_token)location.href='login.html';const api='/api/content?table=programmes',data=document.querySelector('#data'),status=document.querySelector('#status');load.onclick=async()=>{const r=await fetch(api,{headers:{Authorization:`Bearer ${s.access_token}`}}),d=await r.json();data.value=JSON.stringify(d,null,2);status.hidden=false;status.textContent=r.ok?'Loaded.':d.error};save.onclick=async()=>{try{const r=await fetch(api,{method:'POST',headers:{Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:data.value});const d=await r.json();status.hidden=false;status.textContent=r.ok?'Saved.':(d.error||'Save failed')}catch(e){status.hidden=false;status.textContent='Use valid JSON.'}}</script></body></html>
