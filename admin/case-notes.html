<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case notes | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"></head>
<body><main class="login"><a class="back" href="/admin/help-requests">← Help requests</a><p class="eyebrow">Restricted case management</p><h1>Private case notes</h1><p class="lead">Keep notes focused on support and avoid unnecessary identifying details.</p><label class="field">Case ID<input id="case-id" autocomplete="off" required></label><button class="button" id="load" type="button">Load notes</button><div id="notes" aria-live="polite"></div><label class="field">New note<textarea id="note" maxlength="5000"></textarea></label><button class="button" id="add" type="button">Add note</button><p id="status" class="status" hidden aria-live="polite"></p></main>
<script src="session-guard.js"></script><script>
const caseInput=document.querySelector('#case-id'),status=document.querySelector('#status'),notes=document.querySelector('#notes'),initialCaseId=new URLSearchParams(location.search).get('case_id');
if(initialCaseId)caseInput.value=initialCaseId;
function escapeHtml(value){const node=document.createElement('div');node.textContent=String(value||'');return node.innerHTML;}
async function load(){const caseId=caseInput.value.trim();if(!caseId)throw Error('Enter a case ID.');const response=await fetch(`/api/case-notes?case_id=${encodeURIComponent(caseId)}`,{credentials:'same-origin'}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load notes.');notes.innerHTML=data.map(note=>`<article class="card"><p>${escapeHtml(note.note)}</p><small>${new Date(note.created_at).toLocaleString()}</small></article>`).join('')||'<p>No notes yet.</p>';}
document.querySelector('#load').addEventListener('click',()=>load().catch(error=>{status.hidden=false;status.textContent=error.message;}));
document.querySelector('#add').addEventListener('click',async()=>{status.hidden=false;status.textContent='Saving…';try{const response=await fetch('/api/case-notes',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:caseInput.value,note:document.querySelector('#note').value})}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to add note.');status.textContent='Note added.';document.querySelector('#note').value='';await load();}catch(error){status.textContent=error.message;}});
if(initialCaseId)load().catch(error=>{status.hidden=false;status.textContent=error.message;});
</script><script src="/theme.js" defer></script></body></html>
