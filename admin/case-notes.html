<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case notes | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"></head><body><main class="login"><a class="back" href="help-requests.html">← Help requests</a><p class="eyebrow">Restricted case management</p><h1>Private case notes</h1><p class="lead">Enter a case ID to review or add notes. Do not include unnecessary identifying details.</p><label class="field">Case ID<input id="case-id" required></label><button class="button" id="load">Load notes</button><div id="notes"></div><label class="field">New note<textarea id="note"></textarea></label><button class="button" id="add">Add note</button><p id="status" class="status" hidden></p></main><script src="session-guard.js"></script><script>const id=()=>encodeURIComponent(document.querySelector('#case-id').value),status=document.querySelector('#status'),notes=document.querySelector('#notes');async function load(){const r=await fetch(`/api/case-notes?case_id=${id()}`,{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load notes');notes.innerHTML=d.map(n=>`<article class="card"><p>${n.note}</p><small>${new Date(n.created_at).toLocaleString()}</small></article>`).join('')||'<p>No notes yet.</p>'}document.querySelector('#load').onclick=()=>load().catch(e=>status.textContent=e.message);document.querySelector('#add').onclick=async()=>{status.hidden=false;const r=await fetch('/api/case-notes',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:document.querySelector('#case-id').value,note:document.querySelector('#note').value})});const d=await r.json();status.textContent=r.ok?'Note added.':(d.error||'Unable to add note.');if(r.ok){document.querySelector('#note').value='';load()}}</script></body></html>
