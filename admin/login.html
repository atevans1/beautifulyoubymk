<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"><style>.login{max-width:460px;margin:auto}.field{display:grid;gap:.4rem;margin:1rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.login-note{font-size:.9rem}.status{margin-top:1rem;padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><header class="site-header"><a class="brand" href="/">Beautiful You <small>By M.K.</small></a><nav aria-label="Public site"><a href="/about">About</a><a href="/programmes">Programmes</a><a href="/resources">Resources</a><a href="/contact">Contact</a></nav><button class="theme-toggle" type="button" onclick="toggleTheme()">◐ Dark</button></header>
<main class="login"><a class="back" href="/">← Home</a><p class="eyebrow">Authorised access only</p><h1>Admin Login</h1><p class="lead login-note">This area is for approved Beautiful You By M.K. administrators. If you are looking for support, please use <a href="/get-help">Get Help</a>.</p>
<form id="login-form"><label class="field">Email<input name="email" type="email" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Sign in</button><p id="status" class="status" hidden aria-live="polite"></p></form><p><a href="/admin/reset-password">Forgot your password?</a></p></main>
<footer>Beautiful You By M.K. · <a href="/privacy">Privacy</a> · <span class="footer-credit">Designed by <a href="https://dtplay.site" rel="noopener">LoiCodeHub</a></span></footer>
<script>const saved=localStorage.getItem('by-theme'),prefers=window.matchMedia('(prefers-color-scheme: dark)').matches;if(saved==='dark'||(saved===null&&prefers))document.body.classList.add('dark');function toggleTheme(){const dark=document.body.classList.toggle('dark');localStorage.setItem('by-theme',dark?'dark':'light');document.querySelectorAll('.theme-toggle').forEach(button=>button.textContent=dark?'☀ Light':'◐ Dark')}document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),status=document.querySelector('#status');button.disabled=true;button.textContent='Signing in…';status.hidden=false;status.textContent='Signing in securely…';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.elements.email.value,password:form.elements.password.value})}),data=await response.json();if(!response.ok)throw Error(data.error||'Sign-in failed.');location.replace('/admin')}catch(error){status.textContent=error.message}finally{button.disabled=false;button.textContent='Sign in'}})</script><script src="/theme.js" defer></script></body></html>
