<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content management | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"><style>textarea{width:100%;min-height:360px;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:.9rem monospace}.tools{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}</style></head><body><main class="login"><a class="back" href="../index.html">← Public site</a><p class="eyebrow">Admin workspace</p><h1>Content management</h1><p class="lead">Load and update approved Beautiful You content records.</p><label class="field">Content area<select id="table"><option value="posts">Resources / posts</option><option value="programmes">Programmes</option><option value="gallery_items">Gallery</option></select></label><div class="tools"><button class="button" id="load">Load records</button><button class="button" id="save">Save records</button></div><textarea id="data" spellcheck="false">[]</textarea><p id="status" class="status" hidden></p><p><a href="members.html">Manage members</a> · <a href="login.html">Sign in</a></p></main><script>const session=JSON.parse(sessionStorage.getItem('by-auth')||'null');if(!session?.access_token)location.href='login.html';const api=()=>`/api/content?table=${encodeURIComponent(document.querySelector('#table').value)}`,status=document.querySelector('#status');async function load(){status.hidden=false;status.textContent='Loading…';const r=await fetch(api(),{headers:{Authorization:`Bearer ${session.access_token}`}});const d=await r.json();if(!r.ok)throw Error(d.error||'Load failed');document.querySelector('#data').value=JSON.stringify(d,null,2);status.textContent='Records loaded.'}document.querySelector('#load').onclick=()=>load().catch(e=>status.textContent=e.message);document.querySelector('#save').onclick=async()=>{status.hidden=false;try{const body=JSON.parse(document.querySelector('#data').value);const r=await fetch(api(),{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');status.textContent='Saved.'}catch(e){status.textContent=e.message}};</script></body></html>
