<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiries | Beautiful You By M.K.</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../site.css"><style>.toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin:1.5rem 0}.toolbar select{padding:.7rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.enquiry{padding:1.25rem;margin:1rem 0;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.enquiry select{padding:.55rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}.enquiry p{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><a class="back" href="/admin">← Admin workspace</a><p class="eyebrow">Restricted inbox</p><h1>Enquiries</h1><p class="lead">Review messages from people and organisations who want to give, volunteer, or partner. Only authorised administrators can access these records.</p>
  <div class="toolbar"><label for="area">Enquiry type</label><select id="area"><option value="partnership">Partnership</option><option value="volunteer">Volunteer</option><option value="professional">Professional</option><option value="donation">Giving interest</option></select><button class="button" id="refresh" type="button">Refresh</button></div>
  <p id="status" class="status" hidden aria-live="polite"></p><div id="list" aria-live="polite">Loading…</div>
</main><script src="session-guard.js"></script><script>
const area=document.querySelector('#area'),list=document.querySelector('#list'),status=document.querySelector('#status');
const statusOptions={partnership:['new','under_review','contacted','active','closed','declined'],volunteer:['new','under_review','contacted','approved','declined','archived'],professional:['new','under_review','contacted','approved','declined','archived']};
const escapeHtml=value=>{const node=document.createElement('div');node.textContent=String(value??'');return node.innerHTML};
function fields(item,type){if(type==='partnership')return [['Organisation',item.organisation_name],['Contact',item.contact_name],['Email',item.email],['Category',item.category],['Message',item.message]];if(type==='volunteer')return [['Name',item.name],['Email',item.email],['Phone',item.phone],['Location',item.location],['Skills',item.skills],['Availability',item.availability],['Experience',item.relevant_experience]];if(type==='professional')return [['Name',item.name],['Email',item.email],['Organisation',item.organisation_name],['Category',item.professional_category],['Credentials',item.credentials_summary],['Message',item.message]];return [['Name',item.display_name],['Email',item.email]];}
async function load(){list.textContent='Loading…';status.hidden=true;try{const type=area.value,response=await fetch(`/api/operations?area=${encodeURIComponent(type)}`,{credentials:'same-origin'}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load enquiries.');if(!Array.isArray(data))throw Error('The enquiry response was not in the expected format.');list.innerHTML=data.map(item=>`<article class="enquiry"><h2>${escapeHtml(item.organisation_name||item.name||item.display_name||item.contact_name||'Enquiry')}</h2><small>Received ${escapeHtml(new Date(item.created_at).toLocaleString())}</small>${fields(item,type).filter(([,value])=>value).map(([label,value])=>`<p><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</p>`).join('')}${type==='donation'?'':`<label>Status <select data-id="${escapeHtml(item.id)}">${statusOptions[type].map(value=>`<option value="${value}" ${item.status===value?'selected':''}>${value.replaceAll('_',' ')}</option>`).join('')}</select></label>`}</article>`).join('')||'<p>No enquiries have been received in this category.</p>';list.querySelectorAll('select[data-id]').forEach(select=>select.addEventListener('change',async()=>{try{const response=await fetch(`/api/operations?area=${encodeURIComponent(type)}`,{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:select.dataset.id,status:select.value})}),result=await response.json();if(!response.ok)throw Error(result.error||'Status could not be saved.');status.hidden=false;status.textContent='Enquiry status updated.'}catch(error){status.hidden=false;status.textContent=error.message;load()}}));}catch(error){list.textContent='';status.hidden=false;status.textContent=error.message}}
area.addEventListener('change',load);document.querySelector('#refresh').addEventListener('click',load);load();
</script><script src="/theme.js" defer></script></body></html>
