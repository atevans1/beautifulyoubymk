<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the work | Beautiful You By M.K.</title><link rel="stylesheet" href="site.css"><style>.field{display:grid;gap:.4rem;margin:1rem 0}.field input,.field select,.field textarea{padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}.status{padding:.8rem;border-radius:10px;background:var(--sage);color:var(--ink)}</style></head>
<body><main class="login"><a class="back" href="/">← Home</a><p class="eyebrow">Join the work</p><h1>Offer your time or expertise.</h1><form id="application-form"><label class="field">I am applying as<select name="kind" id="kind"><option value="volunteer">Volunteer</option><option value="professional">Professional partner</option></select></label><label class="field">Name<input name="name" maxlength="254" autocomplete="name" required></label><label class="field">Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label class="field" id="category-field">Professional category<input name="professional_category" id="category" maxlength="254"></label><label class="field">How would you like to help?<textarea name="message" maxlength="5000" required></textarea></label><button class="button" type="submit">Send application</button><p id="status" class="status" hidden aria-live="polite"></p></form></main>
<script>const form=document.querySelector('#application-form'),kind=document.querySelector('#kind'),category=document.querySelector('#category'),categoryField=document.querySelector('#category-field'),status=document.querySelector('#status');function updateKind(){const professional=kind.value==='professional';category.required=professional;categoryField.hidden=!professional}kind.addEventListener('change',updateKind);updateKind();form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button'),body=Object.fromEntries(new FormData(form));button.disabled=true;status.hidden=false;status.textContent='Sending…';try{const response=await fetch('/api/public-enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw Error(data.error||'Unable to send.');status.textContent=data.message;form.reset();updateKind()}catch(error){status.textContent=error.message}finally{button.disabled=false}})</script><script src="/theme.js" defer></script></body></html>
