<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the work | Beautiful You By M.K.</title><link rel="stylesheet" href="site.css"></head><body><main class="login"><a class="back" href="index.html">← Home</a><p class="eyebrow">Join the work</p><h1>Offer your time or expertise.</h1><form id="form"><label class="field">I am applying as<select name="kind"><option value="volunteer">Volunteer</option><option value="professional">Professional partner</option></select></label><label class="field">Name<input name="name" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Skills or professional category<input name="professional_category"></label><label class="field">How would you like to help?<textarea name="message" required></textarea></label><button class="button">Send application</button><p id="status" class="status" hidden></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status');s.hidden=false;s.textContent='Sending…';const body=Object.fromEntries(new FormData(form));const r=await fetch('/api/public-enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();s.textContent=r.ok?d.message:(d.error||'Unable to send.');if(r.ok)form.reset()}</script></body></html>
